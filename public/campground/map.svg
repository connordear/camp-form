<svg xmlns="http://www.w3.org/2000/svg" viewBox="200 80 1130 500" role="img" aria-labelledby="t">
  <title id="t">Campground map: Range Rd 281, the access road, the loop road with the campsites along its east side, the camp buildings and the lake</title>
  <!--
    Traced from the north-up layout of the property (roads, lake, buildings),
    redrawn by hand. Site markers are placed by percentage of this drawing, so
    keep the same viewBox (or re-place the sites) if you replace it.
  -->
  <defs>
    <pattern id="grass" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#e6eedb"/>
      <path d="M8 30l2-6 2 6M26 14l2-6 2 6" stroke="#ccd8bc" stroke-width="1.5" fill="none"/>
    </pattern>
    <g id="tree">
      <circle r="13" fill="#bccda6"/>
      <circle r="8" cx="-3" cy="-3" fill="#cbd9b6"/>
    </g>
  </defs>

  <rect x="200" y="80" width="1130" height="500" fill="url(#grass)"/>

  <!-- Lake -->
  <path d="M0 15 L300 392 L328 531 L340 580 L0 580 Z" fill="#a9d8ea"/>
  <text x="250" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#3f6f86" font-style="italic">Lake</text>

  <!-- Trees -->
  <g opacity="0.85">
    <use href="#tree" x="700" y="200"/><use href="#tree" x="760" y="250"/>
    <use href="#tree" x="680" y="320"/><use href="#tree" x="1000" y="380"/>
    <use href="#tree" x="960" y="430"/><use href="#tree" x="1030" y="410"/>
    <use href="#tree" x="1180" y="420"/><use href="#tree" x="1200" y="500"/>
    <use href="#tree" x="1100" y="200"/><use href="#tree" x="640" y="470"/>
  </g>

  <g fill="none" stroke="#c8c3b4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Range Rd 281 -->
    <path d="M1255 70 L1258 120 L1272 590" stroke-width="26"/>
    <!-- Road east of the range road -->
    <path d="M1268 128 L1340 131" stroke-width="16" stroke="#d6d2c6"/>
    <!-- Access road, and its spur to the camp buildings -->
    <path d="M1245 118 L945 128 L597 128 L458 213" stroke-width="18"/>
    <!-- Road south from the access road -->
    <path d="M945 128 Q938 160 916 232 L870 330 L825 425 L812 458 L795 490 L755 518 L690 590" stroke-width="18"/>
    <!-- Loop road -->
    <path d="M918 245 L962 285 Q985 302 1005 307 L1075 320 Q1100 328 1101 355 Q1100 380 1088 395 L1050 450 Q1015 497 990 510 Q960 525 915 518 L862 490 L816 462" stroke-width="16"/>
    <!-- Road south from the loop -->
    <path d="M805 497 L880 590" stroke-width="16"/>
  </g>
  <line x1="1258" y1="120" x2="1272" y2="590" stroke="#f6f3ea" stroke-width="2" stroke-dasharray="14 12"/>

  <!-- Camp buildings -->
  <g fill="#d6d2c6" stroke="#bdb7a6" stroke-width="1.5">
    <path d="M390 238 L425 233 L433 281 L398 286 Z"/>
    <path d="M576 203 L589 202 L593 242 L579 243 Z"/>
    <path d="M414 343 L437 339 L441 365 L418 369 Z"/>
    <path d="M424 391 L439 388 L442 401 L427 404 Z"/>
    <path d="M431 430 L446 427 L449 440 L434 443 Z"/>
    <path d="M438 463 L454 460 L458 482 L442 485 Z"/>
    <path d="M508 367 L529 360 L534 376 L513 383 Z"/>
    <path d="M526 398 L561 393 L566 422 L531 427 Z"/>
  </g>

  <!-- Labels -->
  <g font-family="Arial, sans-serif" fill="#5b5547">
    <text x="1290" y="330" transform="rotate(90 1290 330)" text-anchor="middle" font-size="17" letter-spacing="1">RANGE RD 281</text>
    <text x="780" y="114" text-anchor="middle" font-size="15">Access road</text>
    <text x="1010" y="380" text-anchor="middle" font-size="15" font-style="italic" fill="#6b7a58">Loop road</text>
    <text x="490" y="320" text-anchor="middle" font-size="15">Camp office</text>
    <text x="490" y="338" text-anchor="middle" font-size="15">and cabins</text>
  </g>

  <!-- North arrow -->
  <g transform="translate(1160 200)" font-family="Arial, sans-serif">
    <circle r="26" fill="#f6f3ea" stroke="#8a8270" stroke-width="2"/>
    <path d="M0 -19 L8 7 L0 2 L-8 7 Z" fill="#082616"/>
    <text y="21" text-anchor="middle" font-size="12" font-weight="bold" fill="#082616">N</text>
  </g>
</svg>
